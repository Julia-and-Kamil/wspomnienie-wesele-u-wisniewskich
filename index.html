<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wspomnienia z Wesela u Wiśniewskich</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f8f5f0;
            color: #3d3833;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .card {
            max-width: 650px;
            width: 100%;
            padding: 60px 30px;
            background: rgba(255,255,255,0.9);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .rings {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            font-weight: normal;
            margin: 10px 0;
        }

        h2 {
            font-size: 24px;
            font-weight: normal;
            margin: 10px 0 30px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 16px 30px;
            background: #3d3833;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        .date {
            margin-top: 35px;
            font-size: 15px;
            opacity: 0.7;
        }

        #zdjecia {
            display: none;
        }
    </style>
</head>

<body>

<section class="hero">

    <div class="card">

        <div class="rings">💍</div>

        <h1>Julia & Kamil</h1>

        <h2>Wspomnienia z naszego wesela</h2>

        <p>
            Pokażcie nam ten wyjątkowy dzień
            swoimi oczami. ❤️
            <br><br>
            Dodajcie swoje zdjęcia i pomóżcie nam
            zachować te piękne chwile na zawsze.
        </p>

        <input
    type="file"
    id="zdjecia"
    accept="image/*,video/*"
    multiple
>

        <button
            class="button"
            onclick="document.getElementById('zdjecia').click()"
        >
            📸 Dodaj zdjęcia
        </button>

        <div class="date">
            Z miłością, Julia & Kamil
        </div>
        <div id="galeria" style="margin-top: 50px;">
    <h2>Nasze wspólne wspomnienia ❤️</h2>

    <<div
    id="zdjecia-galeria"
    style="
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 18px;
        margin-top: 30px;
    "
>
</div>

    </div>

</section>

<script>

const SUPABASE_URL = 'https://woejarxmyeinwacaqpgd.supabase.co';

/*
    WAŻNE:
    Wklej tutaj swój obecny Publishable key.
    Nie wysyłaj mi go w wiadomości.
*/
const SUPABASE_KEY = 'sb_publishable_-cVU1wV84GZnUsdKdWVPsQ_26zo1EC7';

const zdjecia = document.getElementById('zdjecia');

zdjecia.addEventListener('change', async function () {

    const pliki = zdjecia.files;

    if (!pliki.length) {
        return;
    }

    alert('📸 Rozpoczynam wysyłanie zdjęć...');

    for (const plik of pliki) {

        const nazwaPliku =
            Date.now() + '-' +
            Math.random().toString(36).substring(2) + '-' +
            plik.name;

        try {

            const odpowiedz = await fetch(
                SUPABASE_URL +
                '/storage/v1/object/zdjecia-z-wesela/' +
                encodeURIComponent(nazwaPliku),
                {
                    method: 'POST',

                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Content-Type': plik.type || 'application/octet-stream'
                    },

                    body: plik
                }
            );

            if (!odpowiedz.ok) {

                const blad = await odpowiedz.text();

                console.error(blad);

                alert('❌ Nie udało się wysłać zdjęcia.');

                return;
            }

        } catch (blad) {

            console.error(blad);

            alert('❌ Wystąpił problem podczas wysyłania zdjęcia.');

            return;
        }
    }

    alert('❤️ Zdjęcia zostały wysłane!');

    zdjecia.value = '';

});
const galeria = document.getElementById('zdjecia-galeria');

async function pokazGalerie() {

    try {

        const odpowiedz = await fetch(
            SUPABASE_URL +
            '/storage/v1/object/list/zdjecia-z-wesela',
            {
                method: 'POST',

                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    prefix: '',
                    limit: 100,
                    offset: 0
                })
            }
        );

        const dane = await odpowiedz.json();

        console.log('Odpowiedź Supabase:', dane);

        if (!odpowiedz.ok) {
            console.error('Błąd Supabase:', dane);
            return;
        }

       galeria.innerHTML = '';

if (!dane.length) {
    galeria.innerHTML =
        '<p>Na razie nie ma jeszcze zdjęć ❤️</p>';
    return;
}

dane.forEach(function (plik) {

    const adres =
        SUPABASE_URL +
        '/storage/v1/object/public/zdjecia-z-wesela/' +
        encodeURIComponent(plik.name);

    const kontener = document.createElement('div');

    kontener.style.position = 'relative';
    kontener.style.overflow = 'hidden';
    kontener.style.borderRadius = '18px';
    kontener.style.background = '#eee';
    kontener.style.aspectRatio = '1 / 1';
    kontener.style.boxShadow = '0 5px 20px rgba(0,0,0,0.08)';

    if (
        plik.name.toLowerCase().endsWith('.mp4') ||
        plik.name.toLowerCase().endsWith('.mov') ||
        plik.name.toLowerCase().endsWith('.webm')
    ) {

        const film = document.createElement('video');

        film.src = adres;
        film.controls = true;
        film.playsInline = true;

        film.style.width = '100%';
        film.style.height = '100%';
        film.style.objectFit = 'cover';

        kontener.appendChild(film);

    } else {

        const obrazek = document.createElement('img');

        obrazek.src = adres;

        obrazek.style.width = '100%';
        obrazek.style.height = '100%';
        obrazek.style.objectFit = 'cover';
        obrazek.style.cursor = 'pointer';

        obrazek.onclick = function () {
            window.open(adres, '_blank');
        };

        kontener.appendChild(obrazek);
    }

    galeria.appendChild(kontener);

});
    } catch (blad) {

        console.error('Błąd galerii:', blad);

        galeria.innerHTML =
            '<p>Nie udało się załadować galerii.</p>';
    }
}

pokazGalerie();
</script>

</body>
</html>

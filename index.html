<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wspomnienia z Wesela u Wiśniewskich</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f8f5f0;
            color: #3d3833;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: linear-gradient(
                rgba(255,255,255,0.75),
                rgba(248,245,240,0.95)
            );
        }

        .card {
            max-width: 650px;
            width: 100%;
            padding: 60px 30px;
            background: rgba(255,255,255,0.85);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .rings {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            font-weight: normal;
            margin: 10px 0;
        }

        h2 {
            font-size: 24px;
            font-weight: normal;
            margin: 10px 0 30px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 16px 30px;
            background: #3d3833;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.85;
        }

        .date {
            margin-top: 35px;
            font-size: 15px;
            opacity: 0.7;
        }

        #zdjecia {
            display: none;
        }

        #status {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="card">

            <div class="rings">💍</div>

            <h1>Julia & Kamil</h1>

            <h2>Wspomnienia z naszego wesela</h2>

            <p>
                Pokażcie nam ten wyjątkowy dzień
                swoimi oczami. ❤️
                <br><br>
                Dodajcie swoje zdjęcia i pomóżcie nam
                zachować te piękne chwile na zawsze.
            </p>

          

                       <input
                type="file"
                id="zdjecia"
                accept="image/*"
                multiple
                style="display: none;"
            >

            <button
                class="button"
                onclick="document.getElementById('zdjecia').click()"
            >
                📸 Dodaj zdjęcia
            </button>

            <div id="status"></div>

            <div class="date">
                Z miłością, Julia & Kamil
            </div>

        </div>

    </section>

</body>
</html>
